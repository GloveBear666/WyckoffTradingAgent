services:
  wyckoff:
    build: .
    image: wyckoff-crypto:local
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    env_file:
      - path: .env.selfhost
        required: false
    volumes:
      - wyckoff-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  wyckoff-data:
